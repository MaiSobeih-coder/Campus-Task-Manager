<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Task Manager Pro</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Background decorative elements -->
<div class="bg-shape shape-1"></div>
<div class="bg-shape shape-2"></div>

<div class="container py-5" style="max-width: 900px; position: relative; z-index: 1;">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h1 class="fw-bold mb-1 gradient-text">Campus Tasks</h1>
            <p class="text-secondary mb-0">Organize your academic life efficiently.</p>
        </div>
        <span class="badge glass-badge px-3 py-2 rounded-pill text-light border border-secondary">
                <i class="bi bi-hdd-network text-success me-1"></i> Spring Boot API
            </span>
    </div>

    <!-- Dashboard Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="glass-card p-3 text-center">
                <h6 class="text-secondary mb-1">Total Tasks</h6>
                <h2 class="mb-0 fw-bold" id="stat-total">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-3 text-center">
                <h6 class="text-secondary mb-1">Pending</h6>
                <h2 class="mb-0 fw-bold text-warning" id="stat-pending">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-3 text-center">
                <h6 class="text-secondary mb-1">Completed</h6>
                <h2 class="mb-0 fw-bold text-success" id="stat-completed">0</h2>
            </div>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="glass-card p-4 mb-4">
        <div class="d-flex justify-content-between mb-2">
            <span class="text-secondary fw-medium">Overall Progress</span>
            <span class="fw-bold text-info" id="progress-text">0%</span>
        </div>
        <div class="progress bg-dark border border-secondary" style="height: 10px;">
            <div id="progress-bar" class="progress-bar bg-info progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;"></div>
        </div>
    </div>

    <!-- Add Task Form -->
    <div class="glass-card p-4 mb-4">
        <h5 class="mb-3 fw-semibold"><i class="bi bi-plus-circle me-2 text-primary"></i>Add New Task</h5>
        <form id="noteForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" id="title" class="form-control glass-input" placeholder="What needs to be done?" required>
                </div>
                <div class="col-md-4">
                    <select id="priority" class="form-select glass-input">
                        <option value="High">🔴 High Priority</option>
                        <option value="Medium" selected>🟡 Medium Priority</option>
                        <option value="Low">🟢 Low Priority</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100 fw-bold"><i class="bi bi-plus-lg"></i> Add</button>
                </div>
                <div class="col-12">
                    <textarea id="content" class="form-control glass-input" rows="2" placeholder="Add more details (optional)..." required></textarea>
                </div>
            </div>
        </form>
    </div>

    <!-- Filters -->
    <div class="d-flex gap-2 mb-3">
        <button class="btn btn-sm glass-filter active" onclick="setFilter('all')">All</button>
        <button class="btn btn-sm glass-filter" onclick="setFilter('pending')">Pending</button>
        <button class="btn btn-sm glass-filter" onclick="setFilter('completed')">Completed</button>
    </div>

    <!-- Task List -->
    <div id="notesList" class="row g-3"></div>
</div>

<!-- Toast for notifications -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toast-message">
                Task deleted successfully!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
